# 방방봐 TURN 서버 (coturn) — WebRTC 미디어 중계
# 셀룰러(CGNAT)·사내망(대칭 NAT) 사이처럼 P2P가 막히는 구간의 영상·음성을 중계한다.
#
# EC2 보안 그룹 인바운드에 다음을 열어야 한다:
#   - 3478/udp, 3478/tcp  (TURN 시그널링·중계 진입점)
#   - 49160-49200/udp     (중계 포트 범위, 아래 min/max-port와 일치)

listening-port=3478
listening-ip=0.0.0.0

# EC2는 NAT 뒤에 있어 공인 IP를 명시해야 후보 주소가 올바르게 만들어진다.
# 형식: external-ip=<공인IP>/<사설IP> — setup.sh 실행 시 자동으로 채워진다
external-ip=PUBLIC_IP/PRIVATE_IP

# 중계에 쓸 UDP 포트 범위 — 동시 세션이 적은 프로젝트라 좁게 잡는다
min-port=49160
max-port=49200

fingerprint

# 고정 계정 방식(lt-cred-mech) — frontend/.env의 VITE_TURN_USERNAME/CREDENTIAL과
# 반드시 같은 값이어야 한다. 값을 바꾸면 양쪽 모두 바꿀 것
lt-cred-mech
user=bangbangbwa:YOUR_TURN_CREDENTIAL
realm=i15a504.p.ssafy.io

# 중계 서버가 내부망(VPC) 공격 통로가 되지 않게 사설 대역으로의 릴레이를 막는다
no-multicast-peers
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255

# 세션당 대역폭 상한(바이트/초) — 1080p 영상 + 음성이면 충분한 여유
max-bps=1500000

no-cli
simple-log
